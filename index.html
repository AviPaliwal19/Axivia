<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axivia</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@200;300;400&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'Posterama';
            src: url('posterama-regular.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #080808;
            color: #e8e4df;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        .header {
            padding: 1rem 0 0;
            text-align: center;
        }
        .wordmark {
            display: block;
            text-align: center;
            font-family: 'Posterama', sans-serif;
            font-size: clamp(1rem, 2.5vw, 1.3rem);
            font-weight: 400;
            letter-spacing: .35em;
            text-transform: uppercase;
            color: #e8e4df;
        }
        .wm-a {
            display: inline-block;
            height: 0.71em;
            vertical-align: baseline;
            fill: currentColor;
            margin-right: .35em;
        }

        .doors-wrap {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2vh 4vw 4vh;
        }

        .doors-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            width: min(720px, 90vw);
            aspect-ratio: 1 / 1;
            border: 1px solid #3a3733;
        }

        .door {
            text-align: center;
            text-decoration: none;
            color: #e8e4df;
            position: relative;
            overflow: hidden;
            transition: color .6s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-right: 1px solid #3a3733;
            border-bottom: 1px solid #3a3733;
            cursor: pointer;
        }
        .door:nth-child(2n) { border-right: none; }
        .door:nth-child(n+3) { border-bottom: none; }

        .door::before {
            content: '';
            position: absolute;
            inset: 0;
            background: #e8e4df;
            transform: translateY(101%);
            transition: transform .6s cubic-bezier(.22, 1, .36, 1);
        }
        .door:hover::before { transform: translateY(0); }
        .door:hover { color: #080808; }

        .door-num {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            font-weight: 700;
            opacity: .1;
            margin-bottom: 1.5rem;
            position: relative;
            z-index: 1;
        }
        .door-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1rem, 2.2vw, 1.6rem);
            font-weight: 400;
            font-style: italic;
            position: relative;
            z-index: 1;
            transition: transform .4s ease;
        }
        .door:hover .door-title { transform: translateY(-8px); }

        .door-hint {
            font-size: .6rem;
            font-weight: 200;
            letter-spacing: .2em;
            text-transform: uppercase;
            color: #3a3733;
            margin-top: 1.2rem;
            position: relative;
            z-index: 1;
            opacity: 0;
            transform: translateY(10px);
            transition: all .4s ease .1s;
        }
        .door:hover .door-hint { opacity: 1; transform: translateY(0); color: #080808; }

        /* ============ BRIEF FORM OVERLAY ============ */
        .brief-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(8, 8, 8, .92);
            backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity .5s ease, visibility .5s ease;
        }
        .brief-overlay.open { opacity: 1; visibility: visible; }

        .brief-panel {
            width: min(560px, 90vw);
            max-height: 90vh;
            overflow-y: auto;
            padding: 4rem 3rem;
            position: relative;
        }

        .brief-close {
            position: absolute;
            top: 0;
            right: 0;
            background: none;
            border: none;
            color: #e8e4df;
            font-size: 1.5rem;
            cursor: pointer;
            padding: .5rem;
            opacity: .5;
            transition: opacity .3s;
        }
        .brief-close:hover { opacity: 1; }

        .brief-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 400;
            font-style: italic;
            color: #e8e4df;
            margin-bottom: .8rem;
        }
        .brief-subtitle {
            font-size: .65rem;
            font-weight: 200;
            letter-spacing: .25em;
            text-transform: uppercase;
            color: #3a3733;
            margin-bottom: 3rem;
        }

        .field {
            margin-bottom: 2rem;
        }
        .field label {
            display: block;
            font-family: 'Playfair Display', serif;
            font-size: .85rem;
            font-weight: 400;
            color: #e8e4df;
            margin-bottom: .6rem;
        }
        .field input,
        .field textarea,
        .field select {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid #3a3733;
            color: #e8e4df;
            font-family: 'Inter', sans-serif;
            font-size: .85rem;
            font-weight: 300;
            padding: .8rem 0;
            outline: none;
            transition: border-color .3s;
            -webkit-appearance: none;
            appearance: none;
            border-radius: 0;
        }
        .field input:focus,
        .field textarea:focus,
        .field select:focus {
            border-bottom-color: #e8e4df;
        }
        .field input::placeholder,
        .field textarea::placeholder {
            color: #3a3733;
            font-weight: 200;
        }
        .field textarea {
            resize: vertical;
            min-height: 80px;
        }
        .field select option {
            background: #080808;
            color: #e8e4df;
        }

        .brief-submit {
            margin-top: 1rem;
            background: transparent;
            border: 1px solid #3a3733;
            color: #e8e4df;
            font-family: 'Inter', sans-serif;
            font-size: .65rem;
            font-weight: 300;
            letter-spacing: .25em;
            text-transform: uppercase;
            padding: 1.2rem 3rem;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: color .5s ease, border-color .5s ease;
        }
        .brief-submit::before {
            content: '';
            position: absolute;
            inset: 0;
            background: #e8e4df;
            transform: translateY(101%);
            transition: transform .5s cubic-bezier(.22, 1, .36, 1);
        }
        .brief-submit:hover { color: #080808; border-color: #e8e4df; }
        .brief-submit:hover::before { transform: translateY(0); }
        .brief-submit span { position: relative; z-index: 1; }

        .brief-sent {
            display: none;
            text-align: center;
            padding: 4rem 0;
        }
        .brief-sent .check {
            font-size: 2rem;
            margin-bottom: 1.5rem;
            color: #e8e4df;
        }
        .brief-sent p {
            font-family: 'Playfair Display', serif;
            font-size: 1.2rem;
            font-style: italic;
            color: #e8e4df;
            margin-bottom: .8rem;
        }
        .brief-sent small {
            font-size: .65rem;
            font-weight: 200;
            letter-spacing: .15em;
            color: #3a3733;
        }

        @media (max-width: 500px) {
            .doors-grid { width: 95vw; }
            .door-num { font-size: 2rem; }
            .brief-panel { padding: 3rem 1.5rem; }
        }
    </style>
</head>
<body>

<div class="header">
    <div class="wordmark">
<svg class="wm-a" viewBox="0 0 100 103"><path fill-rule="evenodd" d="M50 0L100 103H0ZM50 28L13 103H86Z"/></svg>XIVI<svg class="wm-a" viewBox="0 0 100 103"><path fill-rule="evenodd" d="M50 0L100 103H0ZM50 28L13 103H86Z"/></svg>
    </div>
</div>

<div class="doors-wrap">
    <div class="doors-grid">
        <a href="about.html" class="door">

            <span class="door-title">About</span>
            <span class="door-hint">The manifesto</span>
        </a>
        <a href="tel:+919826778888" class="door">

            <span class="door-title">Contact Us</span>
            <span class="door-hint">Begin a conversation</span>
        </a>
        <a href="https://maps.app.goo.gl/DrrcMNv5dBSjPK7UA" target="_blank" rel="noopener" class="door">

            <span class="door-title">Reach Us</span>
            <span class="door-hint">Find our coordinates</span>
        </a>
        <a href="#" class="door" id="briefDoor" onclick="openBrief(event)">

            <span class="door-title">Send Us a Brief</span>
            <span class="door-hint">Share your vision</span>
        </a>
    </div>
</div>

<!-- BRIEF INTAKE FORM -->
<div class="brief-overlay" id="briefOverlay">
    <div class="brief-panel">
        <button class="brief-close" onclick="closeBrief()">&times;</button>

        <form id="briefForm" onsubmit="submitBrief(event)">
            <div class="brief-title">Share your vision</div>
            <div class="brief-subtitle">We'll be in touch within 48 hours</div>

            <div class="field">
                <label>Your name</label>
                <input type="text" name="name" placeholder="Full name" required>
            </div>

            <div class="field">
                <label>How do we reach you?</label>
                <input type="email" name="email" placeholder="Email address" required>
            </div>

            <div class="field">
                <label>Contact number</label>
                <input type="tel" name="phone" placeholder="Phone number" required>
            </div>

            <div class="field">
                <label>What kind of project?</label>
                <select name="project_type" required>
                    <option value="" disabled selected>Select one</option>
                    <option value="residential">Residential</option>
                    <option value="commercial">Commercial</option>
                    <option value="hospitality">Hospitality</option>
                    <option value="other">Something else entirely</option>
                </select>
            </div>

            <div class="field">
                <label>Tell us about your vision</label>
                <textarea name="vision" rows="3" placeholder="What are you imagining? Any scale, any stage — we want to hear it." required></textarea>
            </div>

            <div class="field">
                <label>Budget range</label>
                <select name="budget">
                    <option value="" disabled selected>If you'd like to share</option>
                    <option value="under-50L">Under 50 Lakhs</option>
                    <option value="50L-1Cr">50 Lakhs – 1 Crore</option>
                    <option value="1Cr-5Cr">1 – 5 Crore</option>
                    <option value="5Cr+">5 Crore +</option>
                    <option value="undecided">Not yet decided</option>
                </select>
            </div>

            <button type="submit" class="brief-submit"><span>Send Brief</span></button>
        </form>

        <div class="brief-sent" id="briefSent">
            <div class="check">&#10003;</div>
            <p>Your brief has been received.</p>
            <small>We'll respond to your email within 48 hours.</small>
        </div>
    </div>
</div>

<script>
    function openBrief(e) {
        e.preventDefault();
        document.getElementById('briefOverlay').classList.add('open');
    }
    function closeBrief() {
        document.getElementById('briefOverlay').classList.remove('open');
    }
    document.getElementById('briefOverlay').addEventListener('click', function(e) {
        if (e.target === this) closeBrief();
    });

    function submitBrief(e) {
        e.preventDefault();
        const form = e.target;
        const data = new FormData(form);

        const subject = encodeURIComponent('New Brief from ' + data.get('name'));
        const body = encodeURIComponent(
            'Name: ' + data.get('name') + '\n' +
            'Email: ' + data.get('email') + '\n' +
            'Phone: ' + data.get('phone') + '\n' +
            'Project Type: ' + data.get('project_type') + '\n' +
            'Vision: ' + data.get('vision') + '\n' +
            'Budget: ' + (data.get('budget') || 'Not specified')
        );

        window.location.href = 'mailto:support@axivia.in?subject=' + subject + '&body=' + body;

        form.style.display = 'none';
        document.getElementById('briefSent').style.display = 'block';
    }
</script>

</body>
</html>
